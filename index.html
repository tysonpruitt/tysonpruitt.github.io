    --sheet: #FBFAF9;
    --ink: #2A2526;
    --muted: #5E5A5B;
    --line: #E7E2E0;
    --tint: #F4EAE9;
    --icon: #A8283A;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0E0E0F;
      --sheet: #18191A;
      --ink: #F2F2F3;
      --muted: #A6A9AB;
      --line: #2A2C2E;
      --tint: #2B1E20;
      --icon: #E08A95;
      --red: #7A1A28;
      --white: #EFE4E2;
      color-scheme: dark;

  }
  :root[data-theme="dark"] {
    --paper: #0E0E0F;
    --sheet: #18191A;
    --ink: #F2F2F3;
    --muted: #A6A9AB;
    --line: #2A2C2E;
    --tint: #2B1E20;
    --icon: #E08A95;
    --red: #7A1A28;
    --white: #EFE4E2;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    background: var(--paper);
    color: var(--ink);
    font-family: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  .card {
    width: 100%;
    max-width: 440px;
    background: var(--sheet);
    min-height: 100vh;
    min-height: 100dvh;
  }

  @media (min-width: 520px) {
    body { align-items: flex-start; padding: 64px 16px; }
    .card {
      min-height: 0;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(27, 28, 29, 0.06), 0 24px 48px -24px rgba(27, 28, 29, 0.35);
    }
  }

  /* Identity block */
  .identity {
    background: var(--red);
    color: var(--white);
    padding: calc(56px + env(safe-area-inset-top)) 28px 28px;
  }

  h1 {
    margin: 0 0 36px;
    font-family: "Spectral", Georgia, "Times New Roman", serif;
    font-weight: 500;
    font-size: clamp(48px, 15vw, 60px);
    line-height: 0.98;
    letter-spacing: -0.015em;
  }

  h1 span { display: block; }

  .save {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    min-height: 54px;
    padding: 14px 20px;
    border-radius: 14px;
    background: var(--white);
    color: var(--red);
    font-weight: 600;
    font-size: 16px;
    text-decoration: none;
    transition: background-color 120ms ease;
  }

  .save:hover { background: #FBF5F3; }
  .save:active { background: #EADCD9; }

  .save svg { width: 20px; height: 20px; flex: none; }

  /* Contact list */
  .contacts {
    list-style: none;
    margin: 0;
    padding: 12px 12px 20px;
  }

  .contacts li { position: relative; }

  .contacts li + li::before {
    content: "";
    position: absolute;
    top: 0;
    left: 64px;
    right: 10px;
    height: 1px;
    background: var(--line);
  }

  .contacts a {
    display: grid;
    grid-template-columns: 40px minmax(0, 1fr) 16px;
    align-items: center;
    gap: 14px;
    padding: 15px 10px;
    color: inherit;
    text-decoration: none;
    border-radius: 12px;
  }

  .contacts a:hover,
  .contacts a:active { background: var(--tint); }

  .contacts li:has(a:hover)::before,
  .contacts li:has(a:active)::before,
  .contacts li:has(a:hover) + li::before,
  .contacts li:has(a:active) + li::before { opacity: 0; }

  .icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    background: var(--tint);
    color: var(--icon);
  }

  .contacts a:hover .icon { background: var(--sheet); }

  .icon svg { width: 20px; height: 20px; }

  .label {
    display: block;
    font-weight: 600;
    font-size: 16px;
    line-height: 1.25;
  }

  .detail {
    display: block;
    color: var(--muted);
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .chev { width: 16px; height: 16px; color: var(--muted); opacity: 0.7; }

  a:focus-visible {
    outline: 2px solid var(--icon);
    outline-offset: 2px;
  }

  .identity a:focus-visible { outline-color: var(--white); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
